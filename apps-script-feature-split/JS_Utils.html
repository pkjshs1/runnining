<script>
function refreshDashboardOnly() {
      loadDashboardData(true);
    }

    function todayLocalDate() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }



    function copyUploadLink() {
      const url = location.href.split('?')[0];
      copyText(url, '업로드 링크를 복사했어요 🌷');
    }

    function copyDashboardLink() {
      const url = location.href.split('?')[0] + '?view=dashboard';
      copyText(url, '대시보드 링크를 복사했어요 🏆');
    }

    function copyText(text, message) {
      navigator.clipboard.writeText(text).then(() => setStatus('success', message)).catch(() => setStatus('info', text));
    }

    function downloadTextFile(fileName, text, mimeType) {
      const blob = new Blob([text || ''], { type: mimeType || 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName || 'download.txt';
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 500);
    }

    function triggerCelebration(label) {
      if (state.isDashboardOnly) return;
      const burst = document.createElement('div');
      burst.className = 'celebration-burst';
      const text = label || '완료';
      burst.innerHTML = `<strong>${escapeHtml(text)}</strong><span>🌷 ✨ 🏃‍♀️ 🥇</span>`;
      document.body.appendChild(burst);
      window.setTimeout(() => burst.classList.add('show'), 20);
      window.setTimeout(() => {
        burst.classList.remove('show');
        window.setTimeout(() => burst.remove(), 300);
      }, 1800);
    }

    function setStatus(type, message) {
      if (state.isDashboardOnly) return;
      const el = $('status');
      el.className = `status ${type}`;
      el.textContent = message;
    }

    function clearStatus() {
      const el = $('status');
      el.className = 'status';
      el.textContent = '';
    }

    function showError(message) { setStatus('error', message || '알 수 없는 오류가 발생했어요.'); }
    function dataUrlBytes(dataUrl) { const base64 = String(dataUrl).split(',')[1] || ''; return Math.ceil(base64.length * 3 / 4); }
    function formatMb(bytes) { return (Number(bytes || 0) / 1024 / 1024).toFixed(1); }

    function secondsToDuration(seconds) {
      if (!seconds) return '';
      const total = Math.round(Number(seconds));
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      return h > 0 ? `${h}시간 ${pad2(m)}분 ${pad2(s)}초` : `${m}분 ${pad2(s)}초`;
    }

    function secondsToPace(seconds) {
      if (!seconds) return '';
      const total = Math.round(Number(seconds));
      return `${Math.floor(total / 60)}'${pad2(total % 60)}"/km`;
    }

    function pad2(n) { return String(n).padStart(2, '0'); }
    function escapeHtml(value) { return String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;'); }
    function escapeAttr(value) { return escapeHtml(value).replaceAll('`', '&#096;'); }
    function errorMessage(err) { return !err ? '알 수 없는 오류가 발생했어요.' : (typeof err === 'string' ? err : (err.message || JSON.stringify(err))); }
</script>
